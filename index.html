<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal Checker</title>
<style>
body{font-family:system-ui;max-width:560px;margin:0 auto;padding:16px}
input,button{width:100%;padding:13px;margin:6px 0;font-size:16px;box-sizing:border-box}
button{background:#0b7a6e;color:#fff;border:0;border-radius:10px;font-weight:700}
pre{white-space:pre-wrap;font:inherit;background:#eef2f0;color:#111;padding:14px;border-radius:10px}
</style></head><body>
<h2>Meal Price Checker</h2>
<input id="k" type="password" placeholder="Anthropic API key (sk-ant-...)">
<input id="m" placeholder="Meal name">
<input id="l" placeholder="Restaurant link or name">
<input id="f" type="file" accept="image/*" multiple>
<button id="b">Check prices</button>
<pre id="o"></pre>
<script>
const $=id=>document.getElementById(id);
$('k').value=localStorage.getItem('k')||'';
const toB64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85).split(',')[1])};i.src=x.result};x.readAsDataURL(f)});
$('b').onclick=async()=>{
 const key=$('k').value.trim(),meal=$('m').value.trim(),link=$('l').value.trim(),files=[...$('f').files].slice(0,5);
 if(!key||!meal||(!link&&!files.length)){$('o').textContent='Fill in the key, meal name, and a link or screenshot.';return}
 localStorage.setItem('k',key);
 $('o').textContent='Working... this can take a minute.';$('b').disabled=true;
 try{
  const content=[];
  for(const f of files)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toB64(f)}});
  const src=files.length?'Use the screenshots for prices.':"Search the web for this restaurant's Deliveroo menu.";
  content.push({type:'text',text:'Meal: "'+meal+'". Restaurant: '+(link||'see screenshots')+'. '+src+' List every item in the meal with its standalone price from the same menu (cheapest option where there is a choice, and say so). Then give: items total, meal price, and the saving or extra cost. Use exact menu prices only, never guess. Short plain text, no markdown.'});
  let messages=[{role:'user',content}],data;
  for(let t=0;t<4;t++){
   const body={model:'claude-sonnet-4-6',max_tokens:1500,messages};
   if(!files.length)body.tools=[{type:'web_search_20250305',name:'web_search'}];
   const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
   data=await r.json();
   if(data.error)throw new Error(data.error.message);
   if(data.stop_reason==='pause_turn'){messages=[...messages,{role:'assistant',content:data.content}];continue}
   break;
  }
  $('o').textContent=data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n')||'No answer returned.';
 }catch(e){$('o').textContent='Error: '+e.message}
 $('b').disabled=false;
};
</script></body></html>
